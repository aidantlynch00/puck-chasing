[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.1"
clap = { version = "4.5.27", features = ["derive"] }
diesel = { version = "2.2.7", features = ["returning_clauses_for_sqlite_3_35", "sqlite", "time"] }
diesel-async = { version = "0.5.2", features = ["bb8", "sqlite"] }
dotenv = "0.15.0"
reqwest = { version = "0.12.12", features = ["json"] }
serde = { version = "1.0.217", features = ["derive", "rc"] }
serde_json = "1.0.135"
time = { version = "0.3.37", features = ["parsing", "serde"] }
tokio = { version = "1.43.0", features = ["fs", "macros", "rt-multi-thread", "sync"] }
